services:
  triage:
    build: .
    image: op06-triagebench:local
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OP06_CONFIDENCE_THRESHOLD: "0.58"
      OP06_ALLOW_DEMO_MODEL: "1"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
